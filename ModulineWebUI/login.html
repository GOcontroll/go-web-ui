<!doctype html>
<html lang="en">

<head>
  <title>GOcontroll · Sign in</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" media="(prefers-color-scheme: light)" href="/assets/favicon-light.png">
  <link rel="icon" type="image/png" media="(prefers-color-scheme: dark)" href="/assets/favicon-dark.png">
  <link rel="apple-touch-icon" href="/assets/favicon-large.png">
  <link rel="stylesheet" href="/style/login.css">
  <script src="/js/common.js?v=2" defer></script>
  <script src="/js/login.js?v=2" defer></script>
</head>

<body>
  <div class="center-stage">
    <article class="center-card">
      <div class="logo-block">
        <img src="/assets/logo.svg" alt="GOcontroll">
      </div>
      <h1>Sign in</h1>
      <form id="loginForm">
        <div class="form-group">
          <label for="passkey">Password</label>
          <input type="password" id="passkey" name="passkey" placeholder="Enter password" autofocus required>
        </div>
        <div class="btn-row" style="justify-content:center;margin-top:18px;">
          <button type="submit" class="btn primary" style="min-width:140px;">Log in</button>
        </div>
      </form>
      <p id="set_login_result" class="alert-box"></p>
    </article>
  </div>
</body>

</html>
